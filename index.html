<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Twentyeight and Traumatised</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage" class="stage" aria-label="Video experience">
      <div class="frame">
        <video
          id="layer-a"
          class="layer is-front"
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>
        <video
          id="layer-b"
          class="layer"
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>
        <button
          id="gate"
          class="gate"
          type="button"
          aria-label="Tap to begin"
        >
          Tap to begin
        </button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
